[package]
name = "localtex"
version = "0.1.0"
description = "Editor LaTeX local estilo Overleaf"
edition = "2021"

[lib]
name = "localtex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "sync", "macros"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
strip = true
